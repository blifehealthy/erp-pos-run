# Runnable production deployment layer for ERP-POS.
# Create .env.production from .env.production.example before starting this stack.

name: erp-pos-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp_pos_prod

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erp_pos_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-erp-pos-backend:${RELEASE_VERSION:-local}}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8000"
    networks:
      - erp_pos_prod

  migrate:
    profiles:
      - tools
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-erp-pos-backend:${RELEASE_VERSION:-local}}
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - erp_pos_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-erp-pos-frontend:${RELEASE_VERSION:-local}}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - erp_pos_prod

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
      args:
        NGINX_PROD_CONF: ${NGINX_PROD_CONF:-default.prod.conf}
    image: ${NGINX_IMAGE:-erp-pos-nginx:${RELEASE_VERSION:-local}}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount host-managed certificates here for HTTPS mode, for example:
      # /etc/letsencrypt:/etc/letsencrypt:ro
      - ${LETSENCRYPT_HOST_PATH:-letsencrypt_certs}:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    networks:
      - erp_pos_prod

networks:
  erp_pos_prod:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  letsencrypt_certs:
  nginx_logs:
