services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - erp_network

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    # FIX S3-D-verify: avoid macOS Docker file-sharing failures when the repo lives under Google Drive
    networks:
      - erp_network

  frontend:
    build: ./frontend
    # FIX S3-D-verify: frontend is served through nginx, so skip publishing 3000 to avoid local port conflicts
    depends_on:
      - backend
    # FIX S3-D-verify: run from the built source image instead of bind mounts that break on unshared cloud paths
    networks:
      - erp_network

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
