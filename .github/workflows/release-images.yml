name: Release Images

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable release version, using letters, numbers, dot, underscore, and hyphen only.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.release_version }}

    steps:
      - name: Validate release version
        run: |
          set -eu
          case "$RELEASE_VERSION" in
            ""|*[^A-Za-z0-9._-]*)
              echo "release_version may contain only letters, numbers, dot, underscore, and hyphen" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        run: |
          set -eu
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/erp-pos-backend:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/erp-pos-backend:sha-${{ steps.meta.outputs.short_sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/erp-pos-frontend:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/erp-pos-frontend:sha-${{ steps.meta.outputs.short_sha }}

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile.prod
          push: true
          build-args: |
            NGINX_PROD_CONF=default.prod.conf
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/erp-pos-nginx:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/erp-pos-nginx:sha-${{ steps.meta.outputs.short_sha }}

      - name: Generate release manifest
        run: |
          set -eu
          mkdir -p release-artifacts
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'release_version=%s\n' "$RELEASE_VERSION"
            printf 'created_at_utc=%s\n' "$created_at"
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'git_short_sha=%s\n' '${{ steps.meta.outputs.short_sha }}'
            printf 'image_namespace=%s\n' "$IMAGE_NAMESPACE"
            printf 'backend_image=%s/erp-pos-backend:%s\n' "$IMAGE_NAMESPACE" "$RELEASE_VERSION"
            printf 'frontend_image=%s/erp-pos-frontend:%s\n' "$IMAGE_NAMESPACE" "$RELEASE_VERSION"
            printf 'nginx_image=%s/erp-pos-nginx:%s\n' "$IMAGE_NAMESPACE" "$RELEASE_VERSION"
            printf 'backend_sha_image=%s/erp-pos-backend:sha-%s\n' "$IMAGE_NAMESPACE" '${{ steps.meta.outputs.short_sha }}'
            printf 'frontend_sha_image=%s/erp-pos-frontend:sha-%s\n' "$IMAGE_NAMESPACE" '${{ steps.meta.outputs.short_sha }}'
            printf 'nginx_sha_image=%s/erp-pos-nginx:sha-%s\n' "$IMAGE_NAMESPACE" '${{ steps.meta.outputs.short_sha }}'
            printf 'workflow=release-images\n'
            printf 'notes=Generated by GitHub Actions. Does not include production secrets or full environment values.\n'
          } > release-artifacts/release-manifest.txt

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ env.RELEASE_VERSION }}
          path: release-artifacts/release-manifest.txt
          if-no-files-found: error
