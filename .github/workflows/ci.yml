name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository safety checks
        run: |
          set -eu
          test ! -e .env.production
          test ! -d backups
          test ! -d restore-tmp
          test ! -d uploads
          test ! -d backend/uploads
          test ! -e nginx/conf.d/default.prod.https.conf
          ! find . -path './.git' -prune -o -type f \( -name '*.pem' -o -name '*.key' -o -name '*.crt' -o -name '*.dump' -o -name '*.sql' \) -print | grep -q .
          ! find releases -mindepth 2 -type f -print | grep -q .

      - name: Shell syntax
        run: |
          set -eu
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend npm audit summary
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend regression checks
        run: ./scripts/run-backend-regression.sh

      - name: Create CI production env
        run: |
          cat > .env.ci.production <<'EOF'
          SERVER_NAME=erp-ci.internal.test
          PUBLIC_BASE_URL=https://erp-ci.internal.test
          POSTGRES_DB=erp_pos_db
          POSTGRES_USER=erp_user
          POSTGRES_PASSWORD=DummyCiPassword12345!
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql+asyncpg://erp_user:DummyCiPassword12345!@postgres:5432/erp_pos_db
          REDIS_URL=redis://redis:6379/0
          SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=480
          REFRESH_TOKEN_EXPIRE_DAYS=30
          ENVIRONMENT=production
          CORS_ORIGINS=["https://erp-ci.internal.test"]
          APP_NAME=ERP-POS
          APP_VERSION=1.0.0
          ENABLE_API_DOCS=false
          CELERY_BROKER_URL=redis://redis:6379/1
          CELERY_RESULT_BACKEND=redis://redis:6379/2
          UPLOAD_DIR=/app/uploads
          MAX_UPLOAD_SIZE_MB=5
          ALLOWED_UPLOAD_EXTENSIONS=[".jpg",".jpeg",".png",".webp"]
          ALLOWED_UPLOAD_MIME_TYPES=["image/jpeg","image/png","image/webp"]
          EOF

      - name: Production env validation
        run: ./scripts/check-production-env.sh .env.ci.production

      - name: Docker Compose config
        run: PRODUCTION_ENV_FILE=.env.ci.production RELEASE_VERSION=ci docker compose -f docker-compose.prod.yml config >/dev/null

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t erp-pos-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t erp-pos-frontend:ci ./frontend

      - name: Build nginx production image
        run: docker build -f nginx/Dockerfile.prod -t erp-pos-nginx:ci ./nginx
