limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80;
  server_name localhost 127.0.0.1 erp.blifehealthy.com;
  # FIX S3-D-verify: resolve compose service names via Docker DNS at request time so nginx can start reliably
  resolver 127.0.0.11 ipv6=off;
  client_max_body_size 50M;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss image/svg+xml;
  add_header X-Frame-Options DENY;
  add_header X-Content-Type-Options nosniff;
  add_header X-XSS-Protection "1; mode=block";
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    limit_req zone=api burst=50 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /webhooks/ {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    limit_req zone=api burst=50 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream frontend:3000;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

